# hexa.toml — hexa-mobility standalone package manifest
#
# Spec: shared/hexa-lang/hexa-toml-spec.json (version 1.0.0)
# Distribution target: hx install hexa-mobility
# Provenance: bundled from canon/domains/{infra,energy}/ on 2026-05-10
#             (sister of hexa-matter / hexa-grid).
#
# v0.1.0 ships as a thin BUNDLE of existing mobility-relevant canon docs.
# 13-verb full-template authoring (l5-passenger / l5-truck / l5-robotaxi /
# perception / planning / v2x / mrm / fleet-ops / sim) is tracked in TODO.md
# and slated for v1.0.0.

[package]
name = "hexa-mobility"
version = "0.1.0"
entry = "cli/hexa-mobility.hexa"
description = "n=6 mobility substrate (HEXA family) — bundle of autonomous-driving · EV · vehicle-control · HD-map · robotics-transport · MRM-safety · urban-traffic canon docs. Stage-5 (passenger / truck / robotaxi) substrate, spec-first."
license = "MIT"
authors = ["박민우 <nerve011235@gmail.com>"]
repository = "https://github.com/dancinlab/hexa-mobility"
homepage = "https://github.com/dancinlab/hexa-mobility"
readme = "README.md"
keywords = ["mobility", "autonomous-driving", "l5", "robotaxi", "ev", "hd-map", "v2x", "robotics", "hexa-family"]
categories = ["mobility", "spec-substrate"]

[[bin]]
name = "hexa-mobility"
path = "cli/hexa-mobility.hexa"

[test]
runner = "hexa"
files = [
    "tests/test_selftest.hexa",
]

[scripts]
install = "install.hexa"

# ── Verb manifest (11-doc bundle at v0.1.0; 13-verb authoring future) ─────
verb_parent = "docs"
[verbs]
autonomous_driving      = ["autonomous-driving"]
electric_vehicle        = ["electric-vehicle"]
control_automation      = ["control-automation"]
fun_car                 = ["fun-car"]
cartography_gis         = ["cartography-gis"]
robotics                = ["robotics"]
robotics_transport      = ["robotics-transport"]
motorcycle              = ["motorcycle"]
ultimate_safety         = ["ultimate-safety"]
battery_ev              = ["battery-scale-6-ev"]
governance_safety_urban = ["governance-safety-urban"]

# ── Cross-link (sister substrates — invoke their CLIs directly) ──
# Policy:
#   - EV battery materials / charging infra → hexa-energy CLI
#   - V2X 5G/6G / network protocol           → hexa-grid CLI
#   - SoC / chip-grade autonomy compute      → hexa-chip CLI
#   - Perception ML inference                → hexa-codex CLI
[crosslink]
energy = "dancinlab/hexa-energy (battery cells, charging stations, grid)"
grid   = "dancinlab/hexa-grid (5G/6G + V2X + network protocols)"
chip   = "dancinlab/hexa-chip (vehicle SoC + automotive-grade silicon)"
codex  = "dancinlab/hexa-codex (perception model serving)"

# ── Closure provenance (raw#10 honest C3) ─────────────────
[closure]
verbs_total = 11
groups_total = 11
verbs_wired = 0
verbs_spec = 11
verdict = "BUNDLE_FIRST"
extracted_from = "canon/domains/{infra,energy}/ @ aadcb101"
verify_scripts = 4
verify_pass = 4
verify_pattern = "SPEC_FIRST (sister of hexa-matter/rtsc/ufo/cern/fusion)"
verify_anchors = [
    "SAE J3016 L0-L5 autonomy taxonomy",
    "ISO 26262 ASIL A-D functional safety",
    "NCAP / IIHS crash-test protocols",
    "NHTSA FARS ~1.3 fatality / 100M VMT baseline",
    "Braess's paradox (1968) — network theory HARD",
    "Battery energy density 300 Wh/kg cell (electrochemistry HARD)",
    "Waymo public MPI · CA-DMV disengagement reports",
]
honesty_caveats = [
    "L5 autonomy at scale is UNVERIFIED (raw#10 C3)",
    "Tesla FSD = L2 supervised, not L5",
    "Cruise (GM) defunct as of 2024",
    "ASIL-D claims require ISO 26262 evidence, not lattice fit",
    "NCAP / IIHS use agency protocols, not lattice arithmetic",
    "Each operator uses their OWN MPI metric — no lattice-fit across",
    "Safety claims UNVERIFIED until peer-reviewed/regulator-cleared",
]

# ── Scope honesty (raw#10 C3) ─────────────────────────────
[scope]
honest_scope = "11-doc bundle (existing canon docs only). v0.1.0 ships pre-existing canon spec docs as a thematic mobility substrate. 13-verb full-template author (perception/planning/v2x/mrm/fleet-ops/sim) is TODO."
not_scope = ["EV battery cells (→ hexa-energy CLI)", "V2X 5G/6G / network protocols (→ hexa-grid CLI)", "vehicle SoC / chip (→ hexa-chip CLI)", "perception ML serving (→ hexa-codex CLI)", "13-verb full n=6 HEXA template authoring (TODO.md)"]

# ── Cost profile ──────────────────────────────────────────
[cost]
mac_local_default = "$0 (spec read + CLI dispatcher)"
selftest = "$0 (verb count check)"
